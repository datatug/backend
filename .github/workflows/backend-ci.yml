name: Backend CI

# Go CI for the dalgo-only domain module github.com/datatug/backend.
# Runs strongo's Standard Go CI (lint · test · build) and auto-tags the next
# vX.Y.Z on push to main from conventional-commit messages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - testdata/contract/**
      - spec/features/plans-and-ai-metering/**
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - testdata/contract/**
      - spec/features/plans-and-ai-metering/**
      - .github/workflows/backend-ci.yml

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    permissions:
      contents: write
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      tag_prefix: v
      code_coverage: true
      min_test_coverage_percent: 88

  paid_shared_project_firestore:
    name: Paid shared project Firestore roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned emulator CLI
        run: npm install --global firebase-tools@15.22.4
      - name: Commit, replay and quota-fence against owned Firestore emulator
        env:
          GCLOUD_PROJECT: demo-datatug-paid-create
        run: |
          firebase emulators:exec --only firestore --project demo-datatug-paid-create \
            --config facade4datatug/testdata/firestore-emulator.json \
            "go test -tags=integration -race -count=1 -run '^TestPaidSharedProjectFirestoreRoundtrip$' ./facade4datatug"
