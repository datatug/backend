name: Backend CI

# Go CI for the dalgo-only domain module github.com/datatug/backend.
# Runs strongo's Standard Go CI (lint · test · build) and auto-tags the next
# vX.Y.Z on push to main from conventional-commit messages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - testdata/contract/**
      - spec/features/plans-and-ai-metering/**
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - testdata/contract/**
      - spec/features/plans-and-ai-metering/**
      - .github/workflows/backend-ci.yml

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    permissions:
      contents: write
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOPRIVATE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
    with:
      tag_prefix: v
      code_coverage: true
      min_test_coverage_percent: 88
      # Existing Sneat Releaser App; private-module tokens request read-only
      # access to these exact repositories. Checkout/release still use GITHUB_TOKEN.
      GOPRIVATE: github.com/sneat-co/sneat-core-modules,github.com/sneat-co/paymentus
      goprivate_github_app_client_id: Iv23li26w131Kv6u3IdM
      goprivate_github_app_owner: sneat-co
      goprivate_github_app_repositories: sneat-core-modules,paymentus

  paid_shared_project_firestore:
    name: Paid shared project Firestore roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned emulator CLI
        run: npm install --global firebase-tools@15.22.4
      - name: Mint read-only private Core and Paymentus module token
        id: private-module-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23li26w131Kv6u3IdM
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
          owner: sneat-co
          repositories: sneat-core-modules,paymentus
          permission-contents: read
          skip-token-revoke: false
      - name: Configure ephemeral exact-repository credential helper
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config="${RUNNER_TEMP}/datatug-private-modules-${GITHUB_RUN_ID}-${GITHUB_JOB}.gitconfig"
          helper="${RUNNER_TEMP}/datatug-private-modules-${GITHUB_RUN_ID}-${GITHUB_JOB}.credential-helper"
          : > "$config"
          cat > "$helper" <<'CREDENTIAL_HELPER'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "${1:-}" = get ] || exit 0
          protocol= host= path=
          while IFS='=' read -r key value; do
            case "$key" in
              protocol) protocol="$value" ;;
              host) host="$value" ;;
              path) path="$value" ;;
            esac
          done
          [ "$protocol" = https ] && [ "$host" = github.com ] || exit 0
          case "$path" in
            sneat-co/sneat-core-modules|sneat-co/sneat-core-modules.git|sneat-co/paymentus|sneat-co/paymentus.git)
              printf 'username=x-access-token\npassword=%s\n' "${PRIVATE_MODULE_READ_TOKEN:?missing private module token}"
              ;;
          esac
          CREDENTIAL_HELPER
          chmod 700 "$helper"
          git config --file "$config" credential.https://github.com.useHttpPath true
          git config --file "$config" credential.helper ""
          git config --file "$config" --add credential.helper "$helper"
          echo "GIT_CONFIG_GLOBAL=$config" >> "$GITHUB_ENV"
      - name: Download exact reviewed private module dependencies
        env:
          GOPRIVATE: github.com/sneat-co/sneat-core-modules,github.com/sneat-co/paymentus
          PRIVATE_MODULE_READ_TOKEN: ${{ steps.private-module-token.outputs.token }}
        run: |
          go mod download github.com/sneat-co/sneat-core-modules@v0.92.0
          go mod download github.com/sneat-co/paymentus/backend@v0.33.1
      - name: Remove module credentials before running repository tests
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/datatug-private-modules-${GITHUB_RUN_ID}-${GITHUB_JOB}.gitconfig" \
            "${RUNNER_TEMP}/datatug-private-modules-${GITHUB_RUN_ID}-${GITHUB_JOB}.credential-helper"
      - name: Commit, replay and quota-fence against owned Firestore emulator
        env:
          GCLOUD_PROJECT: demo-datatug-paid-create
          GOPRIVATE: github.com/sneat-co/sneat-core-modules,github.com/sneat-co/paymentus
        run: |
          firebase emulators:exec --only firestore --project demo-datatug-paid-create \
            --config facade4datatug/testdata/firestore-emulator.json \
            "go test -tags=integration -race -count=1 -run '^TestPaidSharedProjectFirestoreRoundtrip$' ./facade4datatug"

      - name: Remove ephemeral module credential configuration
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/datatug-private-modules-${GITHUB_RUN_ID}-${GITHUB_JOB}.gitconfig" \
            "${RUNNER_TEMP}/datatug-private-modules-${GITHUB_RUN_ID}-${GITHUB_JOB}.credential-helper"
        # create-github-app-token's post action also revokes on job failure.
